name: picobello
description: "picobello noc configuration for fpga verification"
network_type: "narrow-wide"

routing:
  route_algo: "XY"
  use_id_table: true

protocols:
  - name: "narrow_in"
    type: "narrow"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 5
    user_width: 3
  - name: "narrow_out"
    type: "narrow"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 2
    user_width: 3
  - name: "wide_in"
    type: "wide"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 4 # necessary for multi-core rt tile
    user_width: 1
  - name: "wide_out"
    type: "wide"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 4 # necessary for multi-core rt tile
    user_width: 1

endpoints:
  - name: "cluster"
    array: [2,4]
    addr_range:
      base: 0xC000_0000
      size: 0x0004_0000
    mgr_port_protocol:
      - "narrow_in"
      - "wide_in"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  - name: "cheshire"
    addr_range:
      - start: 0xA000_0000
        size: 0x2000_0000
        desc: "internal"
      - start: 0x8000_0000
        size: 0x1000_0000
        desc: "external"
    mgr_port_protocol:
      - "narrow_in"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  - name: "fhg_spu"
    addr_range:
      - start: 0xE000_0000
        size: 0x0004_0000
    mgr_port_protocol:
      - "narrow_in"
      - "wide_in"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  - name: "l2_spm"
    array: [5]
    addr_range:
      base: 0xD000_0000
      size: 0x0010_0000
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  
routers:
  - name: "router"
    array: [7, 7]
    degree: 5

connections:
  # Flow A - Critical task - Clusters
  - src: "cluster"
    dst: "router"
    src_range:
    - [0, 0]
    - [0, 0]
    dst_idx: [2, 3]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_range:
    - [0, 0]
    - [1, 1]
    dst_idx: [3, 2]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_range:
    - [0, 0]
    - [2, 2]
    dst_idx: [3, 4]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_range:
    - [0, 0]
    - [3, 3]
    dst_idx: [4, 3]
    dst_dir: "Eject"
  # Flow A - Critical task - Memory
  - src: "l2_spm"
    dst: "router"
    src_range:
    - [0, 0]
    dst_idx: [3, 3]
    dst_dir: "Eject"
  # Flow B - Interferers - Clusters
  - src: "cluster"
    dst: "router"
    src_range:
    - [1, 1]
    - [0, 0]
    dst_idx: [1, 3]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_range:
    - [1, 1]
    - [1, 1]
    dst_idx: [3, 1]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_range:
    - [1, 1]
    - [2, 2]
    dst_idx: [3, 5]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_range:
    - [1, 1]
    - [3, 3]
    dst_idx: [5, 3]
    dst_dir: "Eject"
  # Flow B - Interferers - Memory
  # Allocate L2 SPM banks in the order interferes would access them
  - src: "l2_spm"
    dst: "router"
    src_range:
    - [1, 1]
    dst_idx: [6, 3]
    dst_dir: "Eject"
  - src: "l2_spm"
    dst: "router"
    src_range:
    - [2, 2]
    dst_idx: [3, 6]
    dst_dir: "Eject"
  - src: "l2_spm"
    dst: "router"
    src_range:
    - [3, 3]
    dst_idx: [3, 0]
    dst_dir: "Eject"
  - src: "l2_spm"
    dst: "router"
    src_range:
    - [4, 4]
    dst_idx: [0, 3]
    dst_dir: "Eject"
  # Host processor
  - src: "cheshire"
    dst: "router"
    dst_idx: [6, 1]
    dst_dir: "Eject"
  # Extra Picobello cluster
  - src: "fhg_spu"
    dst: "router"
    dst_idx: [6, 0]
    dst_dir: "Eject"