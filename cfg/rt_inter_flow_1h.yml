name: picobello
description: "Exerimental setup to investigate inter-flow traffic"
network_type: "narrow-wide"

routing:
  route_algo: "XY"
  use_id_table: true

protocols:
  - name: "narrow_in"
    type: "narrow"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 5
    user_width: 3
  - name: "narrow_out"
    type: "narrow"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 4
    user_width: 3
  - name: "wide_in"
    type: "wide"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 8 # necessary for multi-core rt tile
    user_width: 1
  - name: "wide_out"
    type: "wide"
    protocol: "AXI4"
    data_width: 128
    addr_width: 64
    id_width: 8 # necessary for multi-core rt tile
    user_width: 1

endpoints:
  - name: "cluster"
    array: [1,4]
    addr_range:
      base: 0xC000_0000
      size: 0x0004_0000
    mgr_port_protocol:
      - "narrow_in"
      - "wide_in"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  - name: "cheshire"
    addr_range:
      - start: 0xA000_0000
        size: 0x2000_0000
        desc: "internal"
      - start: 0x8000_0000
        size: 0x1000_0000
        desc: "external"
    mgr_port_protocol:
      - "narrow_in"
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  - name: "l2_spm"
    array: [1]
    addr_range:
      base: 0xD000_0000
      size: 0x0010_0000
    sbr_port_protocol:
      - "narrow_out"
      - "wide_out"
  
routers:
  - name: "router"
    array: [3, 3]
    degree: 5

connections:
  # Clusters - Critical tasks
  - src: "cluster"
    dst: "router"
    src_idx: [0, 0]
    dst_idx: [1, 0]
    dst_dir: "Eject"
  # Clusters - Interferer tasks
  - src: "cluster"
    dst: "router"
    src_idx: [0, 1]
    dst_idx: [0, 1]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_idx: [0, 2]
    dst_idx: [1, 2]
    dst_dir: "Eject"
  - src: "cluster"
    dst: "router"
    src_idx: [0, 3]
    dst_idx: [2, 1]
    dst_dir: "Eject"
  # Memory
  - src: "l2_spm"
    dst: "router"
    src_idx: [0]
    dst_idx: [1, 1]
    dst_dir: "Eject"
  # Host processor
  - src: "cheshire"
    dst: "router"
    dst_idx: [2, 2]
    dst_dir: "Eject"