# Note: 32 bursts of 256 beats with 1 DMA is equivalent to moving 128kB of data, which is a reasonable amount for the amount of L1 memory that is typically available in a cluster.

traffic_flows:
  - name: "interferer" # not used
    initiator: [0, 0]
    endpoint: [1, 0]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 0
      length: 256
  - name: "interferer"
    initiator: [1, 0]
    endpoint: [1, 2]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
  - name: "interferer" # not used
    initiator: [2, 0]
    endpoint: [1, 0]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 0
      length: 256

  - name: "interferer"
    initiator: [0, 1]
    endpoint: [1, 2]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
  - name: "critical"
    initiator: [1, 1]
    endpoint: [1, 3]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
  - name: "interferer"
    initiator: [2, 1]
    endpoint: [1, 2]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256

  - name: "interferer"
    initiator: [0, 2]
    endpoint: [1, 3]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
  - name: "interferer"
    initiator: [1, 2]
    endpoint: [1, 3]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
  - name: "interferer"
    initiator: [2, 2]
    endpoint: [1, 3]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
      
  - name: "interferer"
    initiator: [0, 3]
    endpoint: [1, 3]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
  - name: "interferer"
    initiator: [1, 4]
    endpoint: [1, 3]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256
  - name: "interferer"
    initiator: [2, 3]
    endpoint: [1, 3]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 128
      length: 256