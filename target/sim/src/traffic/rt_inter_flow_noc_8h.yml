# Note: 32 bursts of 256 beats with 1 DMA is equivalent to moving 128kB of data, which is a reasonable amount for the amount of L1 memory that is typically available in a cluster.

# NoC-only interference: every interferer joins the critical path of [1, 1] and stays on
# it through the memory router [1, 9], then ejects at the tile [1, 10] just past it.
# The memory port is shared by the four critical flows only.

traffic_flows:
  - name: "interferer" # not used
    initiator: [0, 0]
    endpoint: [1, 0]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 0
      length: 256
  - name: "interferer"
    initiator: [1, 0]
    endpoint: [1, 10]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 32
      length: 256
  - name: "interferer" # not used
    initiator: [2, 0]
    endpoint: [1, 0]
    rw: write
    narrow_burst:
      number: 0
      length: 0
    wide_burst:
      number: 0
      length: 256

  - name: "interferer"
